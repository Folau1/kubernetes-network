apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-container-app
  namespace: hw-1-4
spec:
  replicas: 3
  selector:
    matchLabels:
      app: multi-container-app
  template:
    metadata:
      labels:
        app: multi-container-app
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
              name: nginx-http

        - name: multitool
          image: wbitt/network-multitool:latest
          ports:
            - containerPort: 8080
              name: multitool-http
          env:
            - name: HTTP_PORT
              value: "8080"
